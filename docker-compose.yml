version: '3.9'

services:
  postgres:
    image: postgres:17-alpine
    container_name: funstore_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: funstore
      POSTGRES_PASSWORD: funstore_secret
      POSTGRES_DB: funstore_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U funstore -d funstore_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: funstore_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
